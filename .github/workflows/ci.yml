name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 上的历史任务自动取消，避免排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（lint / 类型 / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本由根 package.json 的 packageManager 字段决定，无需在此固定
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 含 oxfmt --check / oxlint / eslint / stylelint
      - name: 代码规范与格式
        run: pnpm lint

      - name: 类型检查
        run: pnpm check:type

      - name: 构建 @vben/web-antd
        run: pnpm build:antd

  backend:
    name: 后端（编译 / 单元测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      # 单元测试不依赖数据库/Redis（纯逻辑），因此无需起服务容器
      - name: 编译与单元测试
        working-directory: apps/backend
        run: ./mvnw -B clean test
