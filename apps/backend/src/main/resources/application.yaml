spring:
  application:
    name: yorvix

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yorvix}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 表结构由 Flyway 管理（唯一来源：src/main/resources/db/migration）。
  # 不再使用 spring.sql.init —— 那种方式只能在表不存在时建表，无法给已存在的表补列，
  # 加字段只能靠手工 ALTER，漏执行时表现为"登录正常、登录后所有接口 500"。
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 存量库（表已存在但没有 flyway_schema_history）先打一个 version 0 的基线，
    # 再执行 V1。V1 内的语句都是 CREATE TABLE IF NOT EXISTS，因此对存量库是安全的：
    # 已有的表原样跳过，缺失的表（如审计日志表）被补齐。
    # 注意 baseline-version 必须是 0（而不是默认的 1），否则 V1 会被视为"低于基线"而被跳过。
    baseline-on-migrate: true
    baseline-version: 0
    # 迁移失败立即停止启动：带着不确定的表结构运行只会产生更难排查的 500
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  # 后端消息国际化：按请求头 Accept-Language 解析文案（前端 api/request.ts 已带上该头）。
  # 同时作用于 Result.message 与 DTO 校验消息（@NotBlank/@Size 等不再写死 message）。
  messages:
    basename: i18n/messages
    encoding: UTF-8
    # 请求语言不在支持列表时，回退到 i18n/messages.properties（默认中文），
    # 而不是 JVM 的系统 Locale —— 否则"输出语言"会随部署机器变化
    fallback-to-system-locale: false
    # 找不到 key 时返回 key 本身，而不是抛 NoSuchMessageException 变成 500
    use-code-as-default-message: true

  jackson:
    time-zone: Asia/Shanghai
    # 注意：该属性只作用于 java.util.Date / Calendar，**对 LocalDateTime 不生效**
    # （Jackson 对 JSR-310 类型有独立序列化器，不走 ObjectMapper 的 DateFormat）。
    # 本项目实体统一使用 LocalDateTime，其格式由 config/JacksonConfig 显式注册为
    # yyyy-MM-dd HH:mm:ss；这里保留仅为 java.util.Date 字段兜底。
    date-format: yyyy-MM-dd HH:mm:ss

# MyBatis-Plus：表结构由 Flyway 迁移文件统一管理，这里只做行为配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # password_hash -> passwordHash
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto # 数据库自增主键

server:
  port: 4838
  servlet:
    encoding:
      charset: UTF-8
      force: true

# 健康检查探针（/actuator/health、/actuator/info）。
# 注意：/actuator/** 不在 /api/** 下，因此**不受 AuthInterceptor 保护**，
# 所以只暴露 health/info，并且关掉细节展示（否则会把数据库/Redis 的地址与状态吐给匿名访问者）。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# OpenAPI 文档（开发期可交互调试）。这些路径同样不受鉴权拦截器保护，
# 生产 profile 已整体关闭（application-prod.yaml），见 pom.xml 中的说明。
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 按接口路径排序，便于前后端对齐
    operations-sorter: alpha
    tags-sorter: alpha

yorvix:
  token:
    # access token 有效期（分钟）
    expire-minutes: ${TOKEN_EXPIRE_MINUTES:120}
    # refresh token 有效期（分钟），默认 7 天
    refresh-expire-minutes: ${TOKEN_REFRESH_EXPIRE_MINUTES:10080}
  security:
    # 免鉴权路径。匹配语义：**精确匹配**；需要放开整棵子树请显式写 /**（如 /api/public/**）。
    # 刻意不用前缀匹配：那会让 /api/auth/login-audit 这类“恰好以 /api/auth/login 开头”的
    # 新接口自动变成公开接口——开发期毫无迹象，出事时也想不到是白名单。
    # 前三项是认证链路必需，缺任一项系统都不可用，StartupChecks 会拒绝启动。
    white-list:
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/logout
      - /error
    # 允许跨域的来源（逗号分隔）。留空 = 不注册 CORS，只允许同源请求——生产推荐形态
    # （前端静态资源与后端由 Nginx 同源反代，本就不需要跨域）。
    # 开发默认 * 仅为配合前端 5666 端口联调；生产必须配置受信域名，不要用 *。
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    # refresh token Cookie 是否带 Secure 标志（HTTPS 环境必须为 true，prod profile 已置 true）
    cookie-secure: ${COOKIE_SECURE:false}
    # 登录失败次数上限与锁定时长（分钟）：同一账号或同一 IP 连续失败达到上限后拒绝登录。
    # 为什么必须有：登录接口是唯一的匿名写入口，PBKDF2 校验本身消耗 CPU，
    # 不限制时可用极低成本做密码爆破，同时把线程与数据库连接打满。
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    # 取真实客户端 IP 的请求头（留空 = 用 remoteAddr）。
    # 仅在**应用确实位于可信反向代理之后**时才配置（如 Nginx 的 X-Real-IP），
    # 否则请求方可以伪造该头，从而绕过按 IP 的登录限流。见 security/ClientInfoResolver。
    client-ip-header: ${CLIENT_IP_HEADER:}
  init:
    # 首次启动是否初始化内置种子账号（生产环境置为 false）
    seed-enabled: ${SEED_ENABLED:true}
    # 种子超管账号的初始密码（仅本地开发用；生产请注入强口令或直接关闭种子）
    seed-password: ${SEED_ADMIN_PASSWORD:123456}
    # 启动时校验数据库结构是否与实体一致：缺列会导致运行期 500，这里提前成启动期报错
    verify-schema: ${VERIFY_SCHEMA:true}
  menu:
    # 登录后的全局统一首页（所有用户一致），如 /dashboard
    # 留空（默认）= 不干预，回退“自动取该用户第一个可访问页面”
    # 注意：该地址需所有用户都能访问（如 /dashboard 为前端本地固定路由），否则会出现 404/403
    home-path: ${MENU_HOME_PATH:}
    # ADMIN 独占菜单的路由地址前缀（逗号分隔）：命中的菜单及其后代不参与 RBAC 授权
    # （授权树中不展示、写入授权时剔除），它们只由 /api/system/** 上的 @RequiresRoles("ADMIN") 保护。
    # 新增 ADMIN 独占的顶级菜单时必须在此追加，否则会出现“能授权但一访问就 403”。
    admin-only-paths: ${MENU_ADMIN_ONLY_PATHS:/system}

logging:
  level:
    com.zmy.yorvix: debug
  # 这里只保留 console 格式：原来还配了 logging.pattern.file，但项目里既没有
  # logback-spring.xml、也没有设置 logging.file.name，Spring Boot 默认不注册文件 appender，
  # 那份配置从未生效（看着像"日志已落盘"，实际只有 stdout）。容器化部署下"标准输出即日志"
  # 本就是推荐形态，因此直接删掉那段死配置，避免误导；确需落盘请显式设置 LOGGING_FILE_NAME。
  pattern:
    # traceId 由 config/TraceIdFilter 注入 MDC：把同一次请求的所有日志串起来。
    # 调用方可用 X-Request-Id 透传，响应头也会回传同一个值（前端报错时贴出来即可对上日志）。
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%X{traceId:-}]){magenta} %clr(%logger{36}){cyan} - %msg%n'
