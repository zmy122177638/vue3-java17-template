# ============================================================
# 后端消息（默认语言：中文）
#
# 为什么默认文件是中文：ResourceBundle 在当前语言找不到对应文件时，会回退到
# basename 对应的这个无后缀文件（见 application.yaml 的
# spring.messages.fallback-to-system-locale=false）。
# 把它作为中文基准，就不必再单独维护一份 messages_zh_CN.properties，
# 同时任何未支持的语言也能得到一个可读的默认文案，而不是一串 key。
#
# 新增语言：复制本文件为 messages_<locale>.properties（如 messages_ja.properties），
# 逐条翻译即可，不需要改任何 Java 代码。
#
# 注意：含 {0} {1} 的消息会经 MessageFormat 处理，其中单引号 ' 是转义符，
# 需要输出单引号时写成两个（''）。
# ============================================================

# ---------- 通用 ----------
result.success=成功

# ---------- HTTP / 框架层 ----------
error.bad.request=请求参数错误
error.unauthorized=未登录或登录已失效
error.forbidden=无权限访问
error.not.found=资源不存在
error.method.not.allowed=请求方法不支持
error.internal=系统内部错误
error.body.unreadable=请求体格式错误
error.media.type.unsupported=请求内容类型不支持

# ---------- 认证 ----------
error.login.failed=用户名或密码错误
error.account.disabled=账号已被禁用
error.token.invalid=令牌无效或已过期
error.token.missing=缺少访问令牌
error.login.expired=登录状态已失效，请重新登录
error.password.wrong=原密码错误
error.user.not.found=用户不存在
# 登录失败次数超限（占位符为剩余锁定分钟数）
error.login.locked=登录失败次数过多，请 {0} 分钟后重试

# ---------- 用户管理 ----------
error.username.exists=用户名已存在
error.user.delete.self=不能删除当前登录账号
error.user.role.required=请至少为用户分配一个角色
error.role.invalid=存在无效的角色
error.role.disabled=角色[{0}]已禁用，无法分配
error.role.admin.assign.denied=仅超级管理员可分配管理员角色
error.super.immutable=超级管理员账号不可操作
error.admin.protected=无权操作管理员账号，请联系超级管理员

# ---------- 角色管理 ----------
error.role.not.found=角色不存在
error.role.code.exists=角色编码已存在
error.role.builtin.update=内置管理员角色不允许修改
error.role.code.immutable=角色编码不允许修改
error.role.builtin.delete=内置管理员角色不允许删除
error.role.bound=角色已分配给用户，请先解除绑定
error.role.builtin.grant=内置管理员角色拥有全部权限，无需授权

# ---------- 菜单管理 ----------
error.menu.not.found=菜单不存在
error.menu.children.exist=存在子菜单，请先删除子节点
error.menu.sort.mismatch=排序数据不属于同一父级，请刷新后重试
error.menu.invalid=存在无效的菜单
error.menu.parent.self=父级不能是自身
error.menu.parent.descendant=父级不能是自己的子菜单
error.menu.path.required=路由地址不能为空
error.menu.link.required=链接地址不能为空

# ---------- 业务校验（自定义 key） ----------
validation.menu.type.invalid=菜单类型必须为 CATALOG/MENU/BUTTON/EMBEDDED/LINK

# ============================================================
# Jakarta Bean Validation 标准约束的文案覆盖
#
# 覆盖这些 key 后，DTO 上的 @NotBlank / @Size / @Email 等**不需要**再写
# message 属性，文案自动来自这里，且随 Accept-Language 切换。
# {min} {max} {value} {integer} {fraction} 由 Hibernate Validator 从注解属性插值。
# ============================================================
jakarta.validation.constraints.NotBlank.message=不能为空
jakarta.validation.constraints.NotEmpty.message=不能为空
jakarta.validation.constraints.NotNull.message=不能为空
jakarta.validation.constraints.Size.message=长度需在 {min}-{max} 之间
jakarta.validation.constraints.Email.message=邮箱格式不正确
jakarta.validation.constraints.Min.message=不能小于 {value}
jakarta.validation.constraints.Max.message=不能大于 {value}
jakarta.validation.constraints.DecimalMin.message=不能小于 {value}
jakarta.validation.constraints.Digits.message=最多 {integer} 位整数、{fraction} 位小数
