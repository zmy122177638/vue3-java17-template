# ============================================================
# Backend messages (English)
#
# Loaded when the request carries Accept-Language: en-US (or en).
# Keep the key set identical to messages.properties (the Chinese default);
# a missing key falls back to the key itself, which would be shown verbatim
# to the end user.
#
# Messages containing {0} {1} go through MessageFormat, where a single quote
# is an escape character (write '' to output one).
# ============================================================

# ---------- Common ----------
result.success=Success

# ---------- HTTP / framework ----------
error.bad.request=Invalid request parameters
error.unauthorized=Not signed in or the session has expired
error.forbidden=Access denied
error.not.found=Resource not found
error.method.not.allowed=HTTP method not supported
error.internal=Internal server error
error.body.unreadable=Malformed request body
error.media.type.unsupported=Unsupported request content type

# ---------- Authentication ----------
error.login.failed=Incorrect username or password
error.account.disabled=This account has been disabled
error.token.invalid=Invalid or expired token
error.token.missing=Missing access token
error.login.expired=The session has expired, please sign in again
error.password.wrong=Current password is incorrect
error.user.not.found=User not found
# Locked out after too many failed sign-in attempts (placeholder: remaining minutes)
error.login.locked=Too many failed sign-in attempts, please try again in {0} minute(s)

# ---------- User management ----------
error.username.exists=Username already exists
error.user.delete.self=You cannot delete the account you are signed in with
error.user.role.required=At least one role must be assigned to the user
error.role.invalid=One or more roles are invalid
error.role.disabled=Role [{0}] is disabled and cannot be assigned
error.role.admin.assign.denied=Only the super admin can assign the administrator role
error.super.immutable=The super admin account cannot be modified
error.admin.protected=You cannot manage an administrator account, please contact the super admin

# ---------- Role management ----------
error.role.not.found=Role not found
error.role.code.exists=Role code already exists
error.role.builtin.update=The built-in administrator role cannot be modified
error.role.code.immutable=The role code cannot be changed
error.role.builtin.delete=The built-in administrator role cannot be deleted
error.role.bound=This role is assigned to users, unbind them first
error.role.builtin.grant=The built-in administrator role already has all permissions

# ---------- Menu management ----------
error.menu.not.found=Menu not found
error.menu.children.exist=Child menus exist, delete them first
error.menu.sort.mismatch=The sorting data does not belong to the same parent, please refresh
error.menu.invalid=One or more menus are invalid
error.menu.parent.self=A menu cannot be its own parent
error.menu.parent.descendant=The parent cannot be one of its own descendants
error.menu.path.required=Route path is required
error.menu.link.required=Link URL is required

# ---------- Business validation (custom keys) ----------
validation.menu.type.invalid=Menu type must be one of CATALOG/MENU/BUTTON/EMBEDDED/LINK

# ============================================================
# Overrides for the Jakarta Bean Validation standard constraints
# ============================================================
jakarta.validation.constraints.NotBlank.message=must not be blank
jakarta.validation.constraints.NotEmpty.message=must not be empty
jakarta.validation.constraints.NotNull.message=must not be null
jakarta.validation.constraints.Size.message=length must be between {min} and {max}
jakarta.validation.constraints.Email.message=must be a well-formed email address
jakarta.validation.constraints.Min.message=must be greater than or equal to {value}
jakarta.validation.constraints.Max.message=must be less than or equal to {value}
jakarta.validation.constraints.DecimalMin.message=must be greater than or equal to {value}
jakarta.validation.constraints.Digits.message=numeric value out of bounds (max {integer} integer digits and {fraction} fraction digits)
