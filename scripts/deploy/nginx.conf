
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile on;
  # tcp_nopush     on;

  #keepalive_timeout  0;
  # keepalive_timeout 65;

  # gzip：静态产物已由 vite-plugin-compress 预压缩为 .gz（VITE_COMPRESS=gzip，
  # 且其 deleteOriginFile: false 会保留原文件），gzip_static 直接把 .gz 吐给客户端，
  # 零 CPU 开销；gzip on 作为兜底（index.html、未预压缩的资源）。
  gzip on;
  gzip_static on;
  gzip_comp_level 6;
  gzip_min_length 1k;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json
             application/xml text/xml image/svg+xml;

  # 后端上游地址由构建期注入（scripts/deploy/Dockerfile 的 API_UPSTREAM）。
  # 默认 yorvix-api:4838 = 同一 Docker 网络中的后端容器名；
  # 容器名/服务名不同时用 --build-arg API_UPSTREAM=<host>:4838 覆盖。
  # 注意：nginx 在**启动时**解析该主机名，解析不到会直接启动失败（fail-fast）。
  # Docker 网络的 DNS 条目在容器创建时即注册，所以只要后端容器已创建
  # （进程尚未就绪也没关系）前端就能启动；后端容器还没创建时请先创建它。
  upstream yorvix_api {
    server __API_UPSTREAM__;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name localhost;

    client_max_body_size 20m;

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
      # 同源部署（前端静态资源与后端由本机反代统一出口）不需要 CORS 头。
      # 原来无条件写 Access-Control-Allow-Origin: *，等于把静态站点对任意来源开放，
      # 且与后端 allowCredentials 的凭证策略冲突，已删除。
    }

    # API 反代到 Spring Boot。缺了这段，/api/** 会命中上面的 SPA 兜底返回 index.html，
    # 表现为「页面能打开、但所有接口 JSON 解析失败」，且不会有任何后端日志。
    location /api/ {
      proxy_pass http://yorvix_api/api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # 网关生成并透传 traceId：后端 TraceIdFilter 优先使用该头，
      # 应用日志与响应头会回传同一个值（排查问题时按它捞日志）。
      proxy_set_header X-Request-Id $request_id;

      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      # 后端按 IP 限流时需设 CLIENT_IP_HEADER=X-Real-IP（见 README 生产部署清单）
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }
}
